<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f6f7fb" />
  <title>Pecahan</title>
  <style>
    :root{
      --bg1:#f7f8ff;
      --bg2:#fff8f3;
      --text:#1d2230;
      --muted:#747b8d;
      --card:rgba(255,255,255,.86);
      --line:rgba(35,42,63,.08);
      --shadow:0 14px 40px rgba(54,64,98,.10);
      --shadow-hover:0 18px 50px rgba(54,64,98,.16);
      --radius:22px;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 12% 10%, rgba(115,98,255,.12), transparent 26%),
        radial-gradient(circle at 90% 16%, rgba(255,170,96,.16), transparent 28%),
        linear-gradient(145deg,var(--bg1),var(--bg2));
    }

    body{
      min-height:100vh;
      min-height:100dvh;
      display:flex;
      justify-content:center;
    }

    body::before,
    body::after{
      content:"";
      position:fixed;
      border-radius:50%;
      filter:blur(2px);
      pointer-events:none;
      z-index:0;
    }

    body::before{
      width:150px;
      height:150px;
      background:rgba(111,91,255,.08);
      top:-45px;
      right:-35px;
    }

    body::after{
      width:180px;
      height:180px;
      background:rgba(255,166,92,.08);
      left:-60px;
      bottom:-60px;
    }

    main{
      position:relative;
      z-index:1;
      width:min(100%,590px);
      padding:34px 18px calc(36px + env(safe-area-inset-bottom));
    }

    header{
      text-align:center;
      margin:6px 0 26px;
    }

    .logo{
      width:72px;
      height:72px;
      margin:0 auto 14px;
      display:grid;
      place-items:center;
      border-radius:24px;
      font-size:34px;
      font-weight:800;
      background:linear-gradient(145deg,#6e61ff,#9f7cff);
      color:#fff;
      box-shadow:0 14px 30px rgba(110,97,255,.28);
      transform:rotate(-3deg);
    }

    h1{
      margin:0;
      font-size:clamp(34px,8vw,48px);
      line-height:1;
      font-weight:850;
      letter-spacing:-1.8px;
    }

    .subtitle{
      margin:10px 0 0;
      font-size:13px;
      color:var(--muted);
      letter-spacing:.3px;
    }

    .menu{
      display:grid;
      gap:12px;
    }

    button{
      position:relative;
      width:100%;
      border:1px solid var(--line);
      background:var(--card);
      color:var(--text);
      border-radius:var(--radius);
      min-height:68px;
      padding:11px 16px 11px 13px;
      display:flex;
      align-items:center;
      gap:14px;
      font:inherit;
      text-align:left;
      cursor:pointer;
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      transition:transform .16s ease, box-shadow .16s ease, background .16s ease;
      -webkit-tap-highlight-color:transparent;
      overflow:hidden;
    }

    button::after{
      content:"›";
      margin-left:auto;
      font-size:30px;
      line-height:1;
      color:#a5a9b6;
      transform:translateY(-1px);
    }

    button:hover{
      transform:translateY(-2px);
      box-shadow:var(--shadow-hover);
      background:#fff;
    }

    button:active{
      transform:scale(.99);
    }

    button:focus-visible{
      outline:3px solid rgba(110,97,255,.28);
      outline-offset:3px;
    }

    .icon{
      flex:0 0 46px;
      height:46px;
      display:grid;
      place-items:center;
      border-radius:16px;
      font-size:22px;
      font-weight:800;
      color:#fff;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.28);
    }

    .label{
      font-size:15px;
      font-weight:720;
      line-height:1.25;
    }

    button:nth-child(1) .icon{background:linear-gradient(145deg,#635bff,#8c76ff)}
    button:nth-child(2) .icon{background:linear-gradient(145deg,#ff8c61,#ffb067)}
    button:nth-child(3) .icon{background:linear-gradient(145deg,#1fb39a,#55cdb9)}
    button:nth-child(4) .icon{background:linear-gradient(145deg,#e66ba1,#ef8cb6)}
    button:nth-child(5) .icon{background:linear-gradient(145deg,#3687e8,#67a5ef)}
    button:nth-child(6) .icon{background:linear-gradient(145deg,#7c63d8,#a183ef)}
    button:nth-child(7) .icon{background:linear-gradient(145deg,#ef9c2e,#f4b85d)}
    button:nth-child(8) .icon{background:linear-gradient(145deg,#e85d5d,#f08686)}
    button:nth-child(9) .icon{background:linear-gradient(145deg,#2d9e73,#58ba93)}
    button:nth-child(10) .icon{background:linear-gradient(145deg,#525fd5,#7b86e7)}
    button:nth-child(11) .icon{background:linear-gradient(145deg,#d16f2d,#e79a61)}

    @media (max-width:420px){
      main{padding-left:14px;padding-right:14px}
      button{min-height:64px}
      .icon{flex-basis:44px;height:44px}
      .label{font-size:14.5px}
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="logo">½</div>
      <h1>Pecahan</h1>
      <p class="subtitle">by mathnology</p>
    </header>

    <section class="menu" aria-label="Menu Pecahan">
      <button type="button" data-go="0">
        <span class="icon">∑</span>
        <span class="label">Naskah Akademik GNN</span>
      </button>

      <button type="button" data-go="1">
        <span class="icon">÷</span>
        <span class="label">Pembagian Bersusun</span>
      </button>

      <button type="button" data-go="2">
        <span class="icon">●</span>
        <span class="label">Dakon FPB KPK</span>
      </button>

      <button type="button" data-go="3">
        <span class="icon">⌁</span>
        <span class="label">Sengkedan FPB KPK</span>
      </button>

      <button type="button" data-go="4">
        <span class="icon">▦</span>
        <span class="label">Ubin Pecahan</span>
      </button>

      <button type="button" data-go="5">
        <span class="icon">%</span>
        <span class="label">Pecahan CPNS</span>
      </button>

      <button type="button" data-go="6">
        <span class="icon">1½</span>
        <span class="label">Pecahan Campuran</span>
      </button>

      <button type="button" data-go="7">
        <span class="icon">↗</span>
        <span class="label">Ketapel Pecahan</span>
      </button>

      <button type="button" data-go="8">
        <span class="icon">±</span>
        <span class="label">Penjumlahan &amp; Pengurangan Pecahan</span>
      </button>

      <button type="button" data-go="9">
        <span class="icon">×</span>
        <span class="label">Perkalian Pecahan</span>
      </button>

      <button type="button" data-go="10">
        <span class="icon">⅓</span>
        <span class="label">Kartu Pecahan</span>
      </button>
    </section>
  </main>

  <script>
    const tujuan = [
      "https://dosen-uinsi.github.io/Naskah-Akademik-GNN/",
      "https://dosen-uinsi.github.io/PEMBAGIAN-BERSUSUN-POROGAPIT/",
      "https://dosen-uinsi.github.io/DAKON-DIGITAL-FPB-KPK/",
      "https://dosen-uinsi.github.io/SENGKEDAN-FPB-KPK/",
      "https://dosen-uinsi.github.io/Ubin-Pecahan/",
      "https://dosen-uinsi.github.io/Pecahan-CPNS/",
      "https://dosen-uinsi.github.io/PECAHAN-CAMPURAN/",
      "https://dosen-uinsi.github.io/Ketapel-Pecahan/",
      "https://dosen-uinsi.github.io/PENJUMLAHAN-PENGURANGAN-PECAHAN/",
      "https://dosen-uinsi.github.io/PERKALIAN-PECAHAN/",
      "https://dosen-uinsi.github.io/Kartu-Pecahan/"
    ];

    document.querySelectorAll("[data-go]").forEach((button) => {
      button.addEventListener("click", () => {
        window.location.assign(tujuan[Number(button.dataset.go)]);
      });
    });
  </script>
</body>
</html>
